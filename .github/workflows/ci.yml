name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.20

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Install desktop dependencies
        run: bun install --cwd apps/desktop --frozen-lockfile

      - name: Lint web and validate desktop UI build
        run: npm run lint
